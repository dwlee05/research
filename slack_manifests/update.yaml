# 업뎃 Slack 앱 매니페스트 (@update)
# api.slack.com/apps → Create New App → From an app manifest → 워크스페이스 선택 → 이 내용을 붙여 넣기.
# Socket Mode를 쓰므로 공개 URL(Request URL)이 필요 없습니다.
# 토큰은 SLACK_UPDATE_BOT_TOKEN(xoxb-)과 SLACK_UPDATE_APP_TOKEN(xapp-)에 넣습니다.
display_information:
  name: 업뎃
  description: 공저자가 Dropbox에서 바꾼 파일 목록을 바로 알려 주는 비서실 업뎃
  background_color: "#2f5d50"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    # display_name은 ASCII여야 합니다. Slack이 여기서 @멘션 핸들(@update)을 만들기 때문입니다.
    # 그래도 `@업뎃`이라고 입력하면 Slack 자동완성에서 봇을 찾을 수 있습니다(Slack은 앱 이름도 함께 검색합니다).
    # 나중에 App Home → "Your App's Presence in Slack" → Edit에서 표시 이름을 "업뎃"으로 바꿀 수 있습니다
    # (Slack이 받아 주는 경우).
    display_name: update
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      # 사진·음성으로 일정 등록: 멘션·DM에 붙인 사진과 음성 메시지를 내려받습니다(봇이 받은 메시지의 파일만).
      - files:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  # 캘린더 추가 제안의 카테고리 버튼(Family, Teaching, …)을 누르려면 켜야 합니다.
  # Socket Mode라서 Request URL은 필요 없습니다.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
