[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mungchi"
version = "0.1.0"
description = "고뭉치 비서실: 공저자 업데이트(업뎃)와 일정(빠릿)을 챙겨 주는 Claude Agent SDK 멀티 에이전트 비서"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "dropbox>=12.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "slack_bolt>=1.30",
    "slack_sdk>=3.45",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mungchi = "mungchi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
